# Builds the production app (dev.improve.soon2026) on a self-hosted Mac on every push to main and ships it to
# TestFlight, as Haniverse's staging build does: `eas build --local` signs with the credentials EAS manages for the
# improvelabs Expo account, and `eas submit` uploads with the App Store Connect API key EAS holds. One-time setup:
# the "TestFlight" section of mobile/AGENTS.md.
name: TestFlight

on:
  push:
    branches: [main]
    # Only what goes into the app: a frontend-only push shouldn't tie up the runner Mac for a 20-minute build (the
    # Mac agent job, .github/workflows/agent.yml, shares that runner).
    paths:
      - mobile/**
      - packages/**
      - bun.lock
      - bunfig.toml
      - package.json
      - .github/workflows/testflight.yml
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# One build at a time. A push during a build waits for it, and a newer push replaces a waiting one, so the next
# build is always of the latest main.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build and submit to TestFlight
    # The runner is registered on SOON-2026/Ember only; on a mirror or a fork this job would wait for one forever.
    if: github.repository == 'SOON-2026/Ember'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 120
    env:
      EAS_CLI: eas-cli@24.12.1
      # Without it, eas-cli uses the runner Mac's own `eas login`.
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      # `eas build --local` copies the repo, installs it and archives the app in $TMPDIR: about 10 GB.
      - name: Check free disk space
        run: |
          free=$(df -g "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          echo "$free GB free"
          if [ "$free" -lt 25 ]; then
            echo "::error::Only $free GB free on the runner; an iOS build needs about 25 GB."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # For eas-cli, which reads the app config and its plugins from node_modules. The build installs its own copy.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # The leaf detector is gitignored and takes a while to export, so it is cached by what it's built from.
      - name: Restore the leaf detector
        id: leaf-detector
        uses: actions/cache/restore@v6
        with:
          path: packages/owlvit/dist
          key: owlvit-${{ hashFiles('packages/owlvit/export.py', 'packages/owlvit/pyproject.toml', 'packages/owlvit/uv.lock', 'packages/owlvit/fixtures/**') }}

      - if: steps.leaf-detector.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v10.3.0

      - name: Build the leaf detector
        if: steps.leaf-detector.outputs.cache-hit != 'true'
        run: bun run --filter @soon2026/owlvit build

      - name: Save the leaf detector
        if: steps.leaf-detector.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: packages/owlvit/dist
          key: ${{ steps.leaf-detector.outputs.cache-primary-key }}

      - name: Build the app
        working-directory: mobile
        env:
          # The runner empties its temp directory after every job, so a failed or cancelled build leaves nothing behind.
          TMPDIR: ${{ runner.temp }}
          # The build's copy of the repo leaves out the gitignored model; see plugins/with-leaf-detector.js.
          LEAF_DETECTOR_DIST: ${{ github.workspace }}/packages/owlvit/dist
        run: >-
          caffeinate -i bunx "$EAS_CLI" build --platform ios --profile production --local --non-interactive
          --output "$RUNNER_TEMP/soon2026.ipa"

      - name: Read the build number
        id: ipa
        run: |
          build_number=$(unzip -p "$RUNNER_TEMP/soon2026.ipa" 'Payload/*.app/Info.plist' | plutil -extract CFBundleVersion raw -o - -)
          echo "build-number=$build_number" >> "$GITHUB_OUTPUT"

      # Internal testers only, which needs no Beta App Review: the internal "SOON" group distributes every build
      # automatically once App Store Connect has processed it (5–15 minutes after the upload).
      # No --what-to-test: EAS Submit takes a changelog on its Enterprise plan only.
      - name: Upload to TestFlight
        working-directory: mobile
        run: bunx "$EAS_CLI" submit --platform ios --profile production --path "$RUNNER_TEMP/soon2026.ipa" --non-interactive --verbose

      - name: Summary
        run: |
          echo "Build ${{ steps.ipa.outputs.build-number }} of \`${GITHUB_SHA::7}\` is on TestFlight for the SOON group (dev.improve.soon2026)." >> "$GITHUB_STEP_SUMMARY"
